services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: nature
      POSTGRES_PASSWORD: nature
      POSTGRES_DB: nature
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nature']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
